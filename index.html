    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F6F3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111113" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem("nextools-theme");
          var dark = saved === "dark" || ((!saved || saved === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="NexTools: your utility tools, all in one place. JSON formatter, CSV and XML converters, JSON to TypeScript, C#, Java, Kotlin, Swift, Go, Rust, Dart and Python models, and Base64 encoder that run in your browser." />
