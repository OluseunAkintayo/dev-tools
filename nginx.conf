server {
  listen 80;

  root /usr/share/nginx/html;

  index index.html;

  # Revalidate the service worker and manifest, or users keep an old app for as long as the asset cache below allows.
  location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }

  location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|otf|svg|mp4)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public";
    gzip_static on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;
  }
}
